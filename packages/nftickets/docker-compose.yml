version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nftickets_app
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - nftickets_network
    command: npm run dev

  db:
    image: postgres:15
    container_name: nftickets_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nftickets_network

volumes:
  postgres_data:

networks:
  nftickets_network:
