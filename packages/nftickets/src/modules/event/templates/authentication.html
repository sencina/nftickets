<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --success-color: #34C759;
            --failure-color: #FF3B30;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --background: #F2F3F7;
            --card-bg: rgba(255, 255, 255, 0.9);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F2F6FF 0%, #E5E9F0 100%);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            transition: background 0.5s ease;
        }
        
        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
            padding: 32px;
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.6s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }
        
        .header {
            margin-bottom: 24px;
        }
        
        .status-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            animation: pulse 2s infinite, spinIn 1s ease-out;
        }
        
        .success .status-icon {
            background: var(--success-color);
        }
        
        .failure .status-icon {
            background: var(--failure-color);
        }
        
        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            animation: slideDown 0.8s ease-out;
        }
        
        .success .title {
            color: var(--success-color);
        }
        
        .failure .title {
            color: var(--failure-color);
        }
        
        .status-message {
            margin-top: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 500;
            animation: expandIn 0.8s ease-out;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        
        .success .status-message {
            background: rgba(52, 199, 89, 0.1);
            color: var(--success-color);
        }
        
        .failure .status-message {
            background: rgba(255, 59, 48, 0.1);
            color: var(--failure-color);
        }
        
        .details {
            margin-top: 24px;
            text-align: left;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            text-align: left;
            animation: slideRight 0.6s ease-out both;
        }
        
        .info-row:nth-child(2) {
            animation-delay: 0.1s;
        }
        
        .info-row:nth-child(3) {
            animation-delay: 0.2s;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .label {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: transform 0.3s ease;
        }
        
        .info-row:hover .value {
            transform: scale(1.05);
        }
        
        .address {
            word-break: break-all;
            font-family: monospace;
            background-color: rgba(0, 0, 0, 0.03);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #FFFFFF;
                --text-secondary: #AEAEB2;
                --background: #1A1A1A;
                --card-bg: rgba(30, 30, 30, 0.9);
            }
            
            body {
                background: linear-gradient(135deg, #1A1A1A 0%, #0F0F0F 100%);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(52, 199, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes spinIn {
            from { transform: rotate(-180deg) scale(0.5); opacity: 0; }
            to { transform: rotate(0deg) scale(1); opacity: 1; }
        }
        
        @keyframes expandIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container {{statusClass}}">
        <div class="header">
            <div class="status-icon">{{#titleClass.includes('success')}}✓{{else}}✗{{/titleClass.includes}}</div>
            <div class="title">{{title}}</div>
            <div class="status-message">{{statusMessage}}</div>
        </div>
        
        <div class="details">
            <div class="info-row">
                <span class="label">Event</span>
                <span class="value">{{eventName}}</span>
            </div>
            <div class="info-row">
                <span class="label">Sector</span>
                <span class="value">{{sectorName}}</span>
            </div>
            <div class="info-row">
                <span class="label">Wallet</span>
                <span class="value address">{{walletAddress}}</span>
            </div>
        </div>
    </div>
</body>
</html>
